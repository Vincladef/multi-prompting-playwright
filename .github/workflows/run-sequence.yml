name: Multi-Prompting - Exécuter une séquence
on:
  push:
    branches: [main]
    paths:
      - "requests/*.json"
      - "!requests/chain-*.json"
      - "!requests/kernel-*.json"
  workflow_dispatch:
    inputs:
      prompts_json:
        description: "Tableau JSON de prompts, non confidentiels ; test sur page simulée"
        required: true
        type: string
        default: '["ALPHA","BRAVO","CHARLIE"]'
permissions:
  contents: read
concurrency:
  group: multi-prompting-container
  cancel-in-progress: false
jobs:
  sequence:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 180
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Installer les dépendances
        run: npm install --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Vérifier les sources
        run: |
          node --check src/core.mjs
          node --check src/browser.mjs
          node --check src/run-once.mjs
      - name: Envoyer les prompts au navigateur simulé
        env:
          INPUT_PROMPTS_JSON: ${{ github.event.inputs.prompts_json || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node src/run-once.mjs
      - name: Archiver le rapport JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-prompting-report
          path: artifacts/run-report.json
          retention-days: 7
          if-no-files-found: warn
